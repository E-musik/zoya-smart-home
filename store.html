<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="products-section py-5">

  <div class="container">

    <!-- TITLE -->
    <div class="text-center mb-5">

      <h2 class="fw-bold">
        Featured Products
      </h2>

      <p>
        Explore our smart home technology
      </p>

    </div>

    <!-- PRODUCTS -->
    <div class="row g-4">

      <!-- PRODUCT 1 -->
      <div class="col-md-4">

        <div class="card shadow h-100">

          <img
            src="images/security.jpg"
            class="card-img-top"
            alt="Smart Security">

          <div class="card-body text-center">

            <h5 class="card-title">
              Smart Security Camera
            </h5>

            <p>
              Advanced AI-powered surveillance system.
            </p>

          </div>

        </div>

      </div>

      <!-- PRODUCT 2 -->
      <div class="col-md-4">

        <div class="card shadow h-100">

          <img
            src="images/lighting.jpg"
            class="card-img-top"
            alt="Smart Lighting">

          <div class="card-body text-center">

            <h5 class="card-title">
              Smart Lighting
            </h5>

            <p>
              Voice-controlled intelligent lighting solutions.
            </p>

          </div>

        </div>

      </div>

      <!-- PRODUCT 3 -->
      <div class="col-md-4">

        <div class="card shadow h-100">

          <img
            src="images/automation.png"
            class="card-img-top"
            alt="Home Automation">

          <div class="card-body text-center">

            <h5 class="card-title">
              Home Automation Hub
            </h5>

            <p>
              Control all smart devices from one system.
            </p>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>
    
</body>
</html>
